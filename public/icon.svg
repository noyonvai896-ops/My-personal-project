<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0C3FC" />
      <stop offset="45%" stop-color="#8EC5FC" />
      <stop offset="85%" stop-color="#6342E8" />
      <stop offset="100%" stop-color="#4B2CB8" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#B190FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6342E8" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#181528"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7A58E6" stroke-width="4" opacity="0.3"/>
  <circle cx="256" cy="256" r="150" fill="url(#bgGlow)" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="130" fill="url(#coreGlow)" />

  <!-- Waveform / Sound Core -->
  <path d="M 180 256 Q 210 200, 256 256 T 332 256" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 210 256 Q 235 220, 256 256 T 302 256" fill="none" stroke="#E0C3FC" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>

  <!-- NURA branding subtle -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NURA AI</text>
</svg>
